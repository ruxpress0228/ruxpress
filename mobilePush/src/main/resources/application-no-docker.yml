# Docker 없이 PC만으로 기동할 때 사용 (Kafka·Postgres 컨테이너 불필요)
# 실행: mvn spring-boot:run -Dspring-boot.run.profiles=no-docker
# 호스트에 Kafka가 있으면 소비·토픽 생성까지: ...profiles=no-docker,local-kafka
push:
  dev-api-enabled: true

spring:
  datasource:
    url: jdbc:h2:mem:push;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

management:
  health:
    kafka:
      enabled: false

logging:
  level:
    com.ruxpress.push: DEBUG
