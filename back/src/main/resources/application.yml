server:
  port: 8080

spring:
  application:
    name: ruxpress-back
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB
  task:
    scheduling:
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: ruxpress-back-push-result
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  messages:
    basename: messages/messages
    encoding: UTF-8

ruxpress:
  # 로컬 구간 테스트: GET /internal/dev/user-device (기본 비활성)
  dev-verify-api-enabled: ${RUXPRESS_DEV_VERIFY_API:false}
  kafka:
    publish-events: ${RUXPRESS_KAFKA_PUBLISH:false}
    consume-results: ${RUXPRESS_KAFKA_CONSUME_RESULTS:false}
    topics:
      dispatch: ruxpress.notification.push.dispatch
      device-sync: ruxpress.user.device.sync
      result: ruxpress.notification.push.result

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost}
  mail:
    from: ${MAIL_FROM:}
    verification:
      subject: ${MAIL_VERIFICATION_SUBJECT:}
    password-reset:
      subject: ${MAIL_PASSWORD_RESET_SUBJECT:Ruxpress 비밀번호 재설정}
  jwt:
    # 로컬에서 환경 변수 미설정 시에도 기동되도록 기본값(운영은 반드시 JWT_* 로 덮어쓰기)
    secret: ${JWT_SECRET:local-dev-only-change-me-use-strong-secret-in-production-min-32chars}
    expiration: ${JWT_EXPIRATION:86400000}
