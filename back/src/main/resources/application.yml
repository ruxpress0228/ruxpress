server:
  port: 8080

spring:
  application:
    name: ruxpress-back
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB
  task:
    scheduling:
      enabled: true

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  messages:
    basename: messages/messages
    encoding: UTF-8

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost}
  mail:
    from: ${MAIL_FROM:}
    verification:
      subject: ${MAIL_VERIFICATION_SUBJECT:}
    password-reset:
      subject: ${MAIL_PASSWORD_RESET_SUBJECT:Ruxpress 비밀번호 재설정}
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:}
