spring:
  mail:
    # 빈 값이면 Integer.parseInt("") 로 기동 실패하므로 로컬 기본 포트·호스트 사용
    host: ${MAIL_HOST:smtp.local}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: jdbc:h2:mem:ruxpress;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

storage:
  type: local
  local:
    upload-dir: ./uploads

# device-sync / dispatch to mobilePush: RUXPRESS_KAFKA_PUBLISH=true + Kafka.
# 전 스택 Docker: 루트 docker-compose.yml (Kafka bootstrap 컨테이너는 kafka:29092, compose 가 백엔드에 주입).
# 호스트에서만 백엔드 실행 시: docker compose up zookeeper kafka … 후 KAFKA_BOOTSTRAP_SERVERS=localhost:9092
ruxpress:
  dev-verify-api-enabled: ${RUXPRESS_DEV_VERIFY_API:true}
  kafka:
    publish-events: ${RUXPRESS_KAFKA_PUBLISH:false}
    consume-results: ${RUXPRESS_KAFKA_CONSUME_RESULTS:false}

logging:
  # 콘솔 + 파일 (back/ 에서 기동 시 back/logs/ruxpress-back.log)
  file:
    name: logs/ruxpress-back.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
  level:
    com.ruxpress: DEBUG
    org.springframework.security: DEBUG
