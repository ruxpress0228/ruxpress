# Self-contained developer profile: in-memory H2, local file storage, no Kafka, seed accounts.
#   cd back && mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Also used by script/e2e-smoke.sh. Never use it for real data: the schema is recreated on every start.
server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:ruxpress;MODE=MariaDB;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST:smtp.local}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

ruxpress:
  dev-verify-api-enabled: true
  kafka:
    publish-events: false
    consume-results: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-use-strong-secret-in-production-min-32chars}
    expiration: ${JWT_EXPIRATION:604800000}

storage:
  type: local
  local:
    upload-dir: ${UPLOAD_DIR:./uploads}

logging:
  file:
    name: ${LOG_FILE:logs/ruxpress-back.log}
