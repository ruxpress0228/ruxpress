spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ruxpress}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME:ruxpress}
    password: ${DB_PASSWORD:ruxpress}
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate

storage:
  type: local
  local:
    upload-dir: ./uploads

logging:
  level:
    com.ruxpress: INFO
