spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: jdbc:mariadb://mariadb:${DB_HOST:}/${DB_NAME:}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate

ruxpress:
  kafka:
    publish-events: ${RUXPRESS_KAFKA_PUBLISH:true}
    consume-results: ${RUXPRESS_KAFKA_CONSUME_RESULTS:true}

logging:
  level:
    com.ruxpress: INFO
