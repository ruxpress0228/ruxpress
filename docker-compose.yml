services:
  mariadb:
    image: mariadb:11
    container_name: ruxpress-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: ruxpress
      MARIADB_USER: ruxpress
      MARIADB_PASSWORD: ruxpress
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    container_name: ruxpress-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 컨테이너 간: kafka:29092 / 호스트에서 IDE·로컬 백엔드: localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    restart: unless-stopped

  push-postgres:
    image: postgres:16-alpine
    container_name: ruxpress-push-postgres
    environment:
      POSTGRES_USER: push
      POSTGRES_PASSWORD: push
      POSTGRES_DB: ruxpress_push
    volumes:
      - push_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U push -d ruxpress_push"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mobilepush:
    build:
      context: ./mobilePush
      dockerfile: Dockerfile
    container_name: ruxpress-mobilepush
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_started
      push-postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: ruxpress-back
    ports:
      - "8080:8080"
    env_file:
      - ./back/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RUXPRESS_KAFKA_PUBLISH: "true"
      RUXPRESS_KAFKA_CONSUME_RESULTS: "true"
    depends_on:
      mariadb:
        condition: service_healthy
      kafka:
        condition: service_started
      mobilepush:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: ruxpress-front
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  push_pgdata:
  mariadb_data:
